<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>AltRX Constellation &mdash; Patient Support Performance</title>
<style>
  :root{--ink:#0b0b0b;--bds:#c3c2b7;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;}
  .tabs{max-width:900px;margin:0 auto;padding:20px 20px 0;display:flex;gap:8px;}
  .tabs button{font-family:inherit;font-size:14px;font-weight:600;padding:8px 20px;border:1px solid var(--bds);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;}
  .tabs button:hover{border-color:#2a78d6;}
  .tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
  iframe{display:block;width:100%;border:0;}
</style>
</head>
<body>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true">AltRx</button><button role="tab" aria-selected="false">Trinity</button><button role="tab" aria-selected="false">LeanMeds</button><button role="tab" aria-selected="false">NextMeds</button></div>
<iframe title="AltRx" data-src="altrx.html" src="altrx.html"></iframe><iframe title="Trinity" data-src="trinity.html" style="display:none"></iframe><iframe title="LeanMeds" data-src="leanmeds.html" style="display:none"></iframe><iframe title="NextMeds" data-src="nextmeds.html" style="display:none"></iframe>
<script>
(function(){
  var bs=[].slice.call(document.querySelectorAll('.tabs button')),
      fs=[].slice.call(document.querySelectorAll('iframe'));
  // same-origin, so the frame can be measured and grown to its content (no inner scrollbar)
  function fit(f){try{var d=f.contentDocument;if(d&&d.documentElement){
    f.style.height=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0)+'px';}}catch(e){}}
  fs.forEach(function(f){
    f.addEventListener('load',function(){
      fit(f);
      try{var d=f.contentDocument;
        // the client pages have their own inner tabs/day pickers — refit when their content reflows
        if(window.ResizeObserver&&d&&d.body){new ResizeObserver(function(){fit(f);}).observe(d.body);}
      }catch(e){}
    });
  });
  window.addEventListener('resize',function(){fs.forEach(fit);});
  function show(i){
    bs.forEach(function(b,j){b.setAttribute('aria-selected',j===i?'true':'false');});
    fs.forEach(function(f,j){
      if(j===i){
        if(!f.getAttribute('src')){f.setAttribute('src',f.getAttribute('data-src'));}  // first view: load now, at full width
        f.style.display='block'; fit(f);
      } else { f.style.display='none'; }
    });
  }
  bs.forEach(function(b,i){b.addEventListener('click',function(){show(i);});});
})();
</script>
</body>
</html>
